<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マイページ | みずかぜ</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg:#FFF8F0; --card:#fff; --ink:#2D2D2D; --mid:#777; --line:#F0EDE8;
  --blue:#4D96FF; --purple:#C77DFF; --green:#16a34a; --red:#dc2626; --yellow:#FFD93D;
}
html,body { min-height:100%; background:var(--bg); font-family:'Nunito','Noto Sans JP',sans-serif; color:var(--ink); }
body { display:flex; flex-direction:column; align-items:center; padding:28px 16px 48px; }

.header-logo {
  display:inline-flex; align-items:center; gap:8px;
  background:var(--ink); color:#fff; font-size:13px; font-weight:800;
  letter-spacing:0.08em; padding:6px 16px; border-radius:999px; margin-bottom:20px;
}
.header-logo .dot { width:8px; height:8px; background:var(--yellow); border-radius:50%; }

.card {
  background:var(--card); border-radius:24px; width:100%; max-width:480px;
  padding:24px 22px; box-shadow:0 4px 20px rgba(0,0,0,0.07); margin-bottom:14px;
}
.section-label {
  font-size:11px; font-weight:800; letter-spacing:0.14em;
  text-transform:uppercase; color:var(--mid); margin-bottom:10px;
}
.name-select-wrap { position:relative; margin-bottom:14px; }
.name-select {
  width:100%; appearance:none; background:#F7F3FF; border:2px solid #E4D8FF;
  border-radius:14px; padding:13px 44px 13px 18px; font-size:17px; font-weight:800;
  font-family:'Nunito','Noto Sans JP',sans-serif; color:var(--ink); cursor:pointer;
}
.name-select:focus { outline:none; border-color:var(--purple); }
.name-select-arrow { position:absolute; right:16px; top:50%; transform:translateY(-50%); font-size:18px; pointer-events:none; }

.month-nav {
  display:flex; align-items:center; justify-content:space-between;
  background:#F7F3FF; border:2px solid #E4D8FF; border-radius:14px;
  padding:10px 16px; margin-bottom:14px;
}
.btn-month { border:none; background:none; font-size:20px; cursor:pointer; color:var(--purple); font-weight:900; padding:0 8px; }
.month-display { font-size:16px; font-weight:900; color:var(--ink); }

.btn {
  width:100%; border:none; border-radius:14px; padding:14px; font-size:15px;
  font-weight:900; font-family:'Nunito','Noto Sans JP',sans-serif;
  cursor:pointer; transition:opacity 0.15s,transform 0.12s; color:#fff;
}
.btn:active { transform:scale(0.97); opacity:0.85; }
.btn-primary { background:linear-gradient(135deg,var(--blue),var(--purple)); box-shadow:0 6px 16px rgba(77,150,255,0.3); }
.btn-green   { background:linear-gradient(135deg,#6BCB77,#4CAF50); box-shadow:0 6px 16px rgba(107,203,119,0.3); }
.btn-orange  { background:linear-gradient(135deg,#FFB347,#FFA07A); box-shadow:0 6px 16px rgba(255,160,122,0.25); margin-top:10px; }
.btn-gray    { background:#e5e7eb; color:#6b7280; box-shadow:none; margin-top:8px; }

.summary-card {
  background:linear-gradient(135deg,#4D96FF,#C77DFF); border-radius:24px;
  width:100%; max-width:480px; padding:22px 24px;
  box-shadow:0 8px 24px rgba(77,150,255,0.28); margin-bottom:14px; display:none;
}
.summary-card.show { display:block; }
.summary-name  { font-size:20px; font-weight:900; color:#fff; margin-bottom:4px; }
.summary-month { font-size:12px; color:rgba(255,255,255,0.7); font-weight:700; margin-bottom:16px; }
.summary-stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; }
.stat-box { background:rgba(255,255,255,0.18); border-radius:14px; padding:12px 8px; text-align:center; }
.stat-num   { font-size:22px; font-weight:900; color:#fff; line-height:1; margin-bottom:4px; }
.stat-label { font-size:10px; color:rgba(255,255,255,0.75); font-weight:700; }

.log-card {
  background:var(--card); border-radius:24px; width:100%; max-width:480px;
  padding:22px; box-shadow:0 4px 20px rgba(0,0,0,0.07); display:none; margin-bottom:14px;
}
.log-card.show { display:block; }

.log-table { width:100%; border-collapse:collapse; font-size:12px; }
.log-table th {
  font-size:9px; font-weight:800; color:var(--mid); padding:0 4px 10px;
  border-bottom:2px solid var(--line); white-space:nowrap; text-align:center;
}
.log-table td { padding:9px 4px; border-bottom:1px dashed var(--line); text-align:center; vertical-align:middle; }
.log-table tr:last-child td { border-bottom:none; }
.td-date { font-weight:800; white-space:nowrap; }
.td-day  { font-size:10px; color:var(--mid); }

.time-in-normal { color:var(--green); font-weight:700; font-variant-numeric:tabular-nums; }
.time-in-late   { color:var(--red);   font-weight:700; font-variant-numeric:tabular-nums; }
.time-out       { color:var(--green); font-weight:700; font-variant-numeric:tabular-nums; }
.time-work      { color:#7c3aed; font-weight:800; font-variant-numeric:tabular-nums; }
.time-empty     { color:#ccc; }
.time-scheduled { color:#555; font-variant-numeric:tabular-nums; }

.btn-correct {
  background:none; border:1.5px solid #d1d5db; border-radius:8px;
  padding:3px 8px; font-size:11px; font-weight:800; color:var(--mid);
  cursor:pointer; font-family:'Nunito','Noto Sans JP',sans-serif;
}
.btn-correct:hover { background:#f3f4f6; }

/* モーダル共通 */
.modal-overlay {
  position:fixed; inset:0; background:rgba(0,0,0,0.45);
  display:none; align-items:center; justify-content:center; padding:20px; z-index:100;
}
.modal-overlay.show { display:flex; }
.modal {
  background:#fff; border-radius:24px; padding:28px 24px; width:100%; max-width:360px;
  box-shadow:0 20px 60px rgba(0,0,0,0.2);
  animation:popIn 0.2s cubic-bezier(0.34,1.56,0.64,1);
}
@keyframes popIn { from{transform:scale(0.85);opacity:0} to{transform:scale(1);opacity:1} }
.modal-title { font-size:17px; font-weight:900; margin-bottom:4px; }
.modal-sub   { font-size:12px; color:var(--mid); margin-bottom:20px; }
.form-group  { margin-bottom:14px; }
.form-label  { font-size:11px; font-weight:800; letter-spacing:0.1em; color:var(--mid); margin-bottom:6px; display:block; }
.form-select, .form-input, .form-textarea {
  width:100%; border:2px solid #e5e7eb; border-radius:12px;
  padding:11px 14px; font-size:15px; font-weight:700;
  font-family:'Nunito','Noto Sans JP',sans-serif; color:var(--ink); background:#fafafa;
}
.form-select:focus, .form-input:focus, .form-textarea:focus { outline:none; border-color:var(--blue); }
.form-textarea { resize:vertical; min-height:70px; font-size:14px; }

.loading { text-align:center; padding:24px; color:var(--mid); font-size:14px; font-weight:700; display:none; width:100%; max-width:480px; }
.loading.show { display:block; }
.spinner { display:inline-block; width:22px; height:22px; border:3px solid #e4d8ff; border-top-color:var(--purple); border-radius:50%; animation:spin 0.7s linear infinite; margin-bottom:8px; }
@keyframes spin { to{transform:rotate(360deg)} }

.toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(80px); background:#2D2D2D; color:#fff; padding:12px 24px; border-radius:999px; font-size:14px; font-weight:700; transition:transform 0.3s; z-index:200; white-space:nowrap; }
.toast.show { transform:translateX(-50%) translateY(0); }

/* 出勤予定バッジ */
.schedule-badge {
  font-size:9px; font-weight:900; padding:1px 5px; border-radius:999px;
  background:#dbeafe; color:#1d4ed8; margin-left:3px;
}
</style>
</head>
<body>

<div class="header-logo"><span class="dot"></span>みずかぜ会計事務所 — マイページ</div>

<div class="card">
  <div class="section-label">👤 名前を選んでね</div>
  <div class="name-select-wrap">
    <select class="name-select" id="nameSelect">
      <option value="">読み込み中...</option>
    </select>
    <span class="name-select-arrow">▾</span>
  </div>
  <div class="section-label">📅 月を選んでね</div>
  <div class="month-nav">
    <button class="btn-month" onclick="月変更(-1)">‹</button>
    <div class="month-display" id="monthDisplay"></div>
    <button class="btn-month" onclick="月変更(1)">›</button>
  </div>
  <button class="btn btn-primary" onclick="ログ取得()">📋 打刻を見る</button>
  <button class="btn btn-orange"  onclick="出勤予定モーダル開く()">📅 出勤予定を変更する</button>
</div>

<div class="loading" id="loading"><div class="spinner"></div><br>読み込み中...</div>

<div class="summary-card" id="summaryCard">
  <div class="summary-name"  id="summaryName"></div>
  <div class="summary-month" id="summaryMonth"></div>
  <div class="summary-stats">
    <div class="stat-box"><div class="stat-num" id="statDays">0</div><div class="stat-label">出勤日数</div></div>
    <div class="stat-box"><div class="stat-num" id="statWork">00:00</div><div class="stat-label">合計勤務</div></div>
    <div class="stat-box"><div class="stat-num" id="statMissing">0</div><div class="stat-label">打刻漏れ</div></div>
  </div>
</div>

<div class="log-card" id="logCard">
  <div class="section-label">📋 日別打刻一覧</div>
  <div style="overflow-x:auto">
    <table class="log-table">
      <thead>
        <tr>
          <th>日付</th>
          <th>定時</th>
          <th>出勤</th>
          <th>退勤</th>
          <th>休憩</th>
          <th>勤務時間</th>
          <th>修正</th>
        </tr>
      </thead>
      <tbody id="logBody"></tbody>
    </table>
  </div>
</div>

<!-- 打刻修正モーダル -->
<div class="modal-overlay" id="correctOverlay">
  <div class="modal">
    <div class="modal-title">⏱ 打刻修正申請</div>
    <div class="modal-sub" id="correctSub"></div>
    <div class="form-group">
      <label class="form-label">修正する種別</label>
      <select class="form-select" id="correctType" onchange="種別切替()">
        <option value="出勤">出勤時刻</option>
        <option value="退勤">退勤時刻</option>
        <option value="休憩">休憩時間（分）</option>
        <option value="定時">定時変更</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label" id="correctInputLabel">正しい時刻</label>
      <input class="form-input" type="time"   id="correctTime">
      <input class="form-input" type="number" id="correctBreak" placeholder="例: 60" min="0" max="480" style="display:none;margin-top:8px;">
    </div>
    <div class="form-group">
      <label class="form-label">修正理由</label>
      <textarea class="form-textarea" id="correctReason" placeholder="例：朝一外出のため、事務所到着後に打刻しました"></textarea>
    </div>
    <button class="btn btn-green" onclick="修正申請送信()">📨 申請する</button>
    <button class="btn btn-gray"  onclick="モーダル閉じる('correctOverlay')">キャンセル</button>
  </div>
</div>

<!-- 出勤予定申告モーダル -->
<div class="modal-overlay" id="scheduleOverlay">
  <div class="modal">
    <div class="modal-title">📅 出勤予定変更</div>
    <div class="modal-sub">翌日以降1ヶ月先まで変更できます（当日の変更は修正ボタンから）</div>
    <div class="form-group">
      <label class="form-label">日付</label>
      <input class="form-input" type="date" id="scheduleDate">
    </div>
    <div class="form-group">
      <label class="form-label">出勤予定時刻</label>
      <input class="form-input" type="time" id="scheduleTime">
    </div>
    <button class="btn btn-green" onclick="出勤予定送信()">✅ 変更する</button>
    <button class="btn btn-gray"  onclick="モーダル閉じる('scheduleOverlay')">キャンセル</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const GAS_URL = "https://script.google.com/macros/s/AKfycbyXDefabugGgXhAbJnDR-jaCWGTR4csKM4kn7wfVmMDzP-z-O6HNpcVJjj3UkxhyiCY/exec";

const now = new Date();
let 表示年 = now.getFullYear();
let 表示月 = now.getMonth() + 1;
let 選択中の日付 = "";
let 社員マスタMap = {};
let 出勤予定Map = {};

// 月表示
function 月表示更新() {
  document.getElementById("monthDisplay").textContent = `${表示年}年${表示月}月`;
}
月表示更新();

function 月変更(delta) {
  表示月 += delta;
  if (表示月 > 12) { 表示月 = 1;  表示年++; }
  if (表示月 < 1)  { 表示月 = 12; 表示年--; }
  月表示更新();
  if (document.getElementById("logCard").className.includes("show")) ログ取得();
}

// 社員リスト
async function 社員リスト読み込み() {
  const sel = document.getElementById("nameSelect");
  try {
    const res  = await fetch(`${GAS_URL}?action=getNames`);
    const data = await res.json();
    sel.innerHTML = '<option value="">― 名前を選んでください ―</option>';
    (data.names || []).forEach(name => {
      const opt = document.createElement("option");
      opt.value = name; opt.textContent = name;
      sel.appendChild(opt);
    });
    if (data.masters) {
      data.masters.forEach(m => { 社員マスタMap[m.name] = m; });
    }
  } catch(e) {
    sel.innerHTML = '<option value="">読み込み失敗 — リロードしてください</option>';
  }
}
社員リスト読み込み();

// 時刻→分
function timeToMin(t) {
  if (!t) return null;
  const [h, m] = t.split(":").map(Number);
  return h * 60 + m;
}

// 分→HH:MM
function minToHHMM(mins) {
  if (!mins || mins <= 0) return "―";
  return `${String(Math.floor(mins/60)).padStart(2,"0")}:${String(mins%60).padStart(2,"0")}`;
}

// 遅刻判定
function isLate(scheduledIn, actualIn) {
  if (!scheduledIn || !actualIn) return false;
  return timeToMin(actualIn) > timeToMin(scheduledIn);
}

// 15分刻み切り捨て（退勤）
function roundDownTo15(t) {
  if (!t) return null;
  const m = timeToMin(t);
  return Math.floor(m / 15) * 15;
}

// 15分刻み切り上げ（出勤）
function roundUpTo15(t) {
  if (!t) return null;
  const m = timeToMin(t);
  return Math.ceil(m / 15) * 15;
}

// 勤務時間計算（15分刻み）
function calcWorkMin(scheduledIn, inTime, outTime, breakMin) {
  const outM = roundDownTo15(outTime);
  if (outM === null) return null;
  const late = isLate(scheduledIn, inTime);
  let startM;
  if (late) {
    startM = roundUpTo15(inTime); // 遅刻：出勤打刻を15分刻み切り上げ
  } else {
    startM = timeToMin(scheduledIn); // 定時通り：定時から
  }
  if (startM === null) return null;
  return Math.max(0, outM - startM - (parseInt(breakMin) || 0));
}

// ログ取得
async function ログ取得() {
  const 名前 = document.getElementById("nameSelect").value;
  if (!名前) { alert("名前を選んでください！"); return; }

  document.getElementById("loading").className     = "loading show";
  document.getElementById("summaryCard").className = "summary-card";
  document.getElementById("logCard").className     = "log-card";

  try {
    const [logRes, schedRes] = await Promise.all([
      fetch(`${GAS_URL}?action=getMyLog&name=${encodeURIComponent(名前)}&year=${表示年}&month=${表示月}`),
      fetch(`${GAS_URL}?action=getSchedule&name=${encodeURIComponent(名前)}&year=${表示年}&month=${表示月}`)
    ]);
    const logData  = await logRes.json();
    const schedData = await schedRes.json();
    出勤予定Map = schedData.schedule || {};
    ログ表示(名前, 表示年, 表示月, logData.logs || [], logData.master || {});
  } catch(e) {
    ログ表示(名前, 表示年, 表示月, [], {});
  }
  document.getElementById("loading").className = "loading";
}

function ログ表示(名前, year, month, logs, master) {
  const days  = ["日","月","火","水","木","金","土"];
  const pad   = n => String(n).padStart(2,"0");
  const 日数  = new Date(year, month, 0).getDate();

  const scheduledIn  = master.scheduledIn  || 社員マスタMap[名前]?.scheduledIn  || "";
  const rawBreak = master.breakMin ?? 社員マスタMap[名前]?.breakMin ?? 60;
  const defaultBreak = parseInt(rawBreak);

  const rows = [];
  for (let d = 1; d <= 日数; d++) {
    const dt      = new Date(year, month-1, d);
    const dow     = dt.getDay();
    const dateStr = `${year}/${pad(month)}/${pad(d)}`;
    const log     = logs.find(l => l.date === dateStr) || {};
    // 日ごとのbreakMin（修正申請で変更された場合はそちらを優先）
    const breakMin = (log.breakMin !== null && log.breakMin !== undefined)
      ? parseInt(log.breakMin)
      : defaultBreak;
    const dayScheduledIn = 出勤予定Map[dateStr] || scheduledIn;
    rows.push({ dateStr, dow, in: log.in||"", out: log.out||"", scheduledIn: dayScheduledIn, breakMin, hasSchedule: !!出勤予定Map[dateStr] });
  }

  // サマリー計算
  let 出勤日数 = 0, 漏れ = 0, 実働合計 = 0;
  rows.forEach(r => {
    if (r.dow === 0 || r.dow === 6) return;
    if (r.in || r.out) 出勤日数++;
    if ((r.in && !r.out) || (!r.in && r.out)) 漏れ++;
    const w = calcWorkMin(r.scheduledIn, r.in, r.out, r.breakMin);
    if (w) 実働合計 += w;
  });

  document.getElementById("summaryName").textContent  = `${名前} さん`;
  document.getElementById("summaryMonth").textContent = `${year}年${month}月の打刻`;
  document.getElementById("statDays").textContent     = 出勤日数 + "日";
  document.getElementById("statWork").textContent     = minToHHMM(実働合計);
  document.getElementById("statMissing").textContent  = 漏れ + "件";
  document.getElementById("summaryCard").className    = "summary-card show";

  const tbody = document.getElementById("logBody");
  tbody.innerHTML = "";

  rows.forEach(r => {
    const isWE  = r.dow === 0 || r.dow === 6;
    const hasIn = !!r.in, hasOut = !!r.out;
    const late  = isLate(r.scheduledIn, r.in);
    const workM = calcWorkMin(r.scheduledIn, r.in, r.out, r.breakMin);

    const scheduledCell = r.scheduledIn
      ? `${r.scheduledIn}${r.hasSchedule ? '<span class="schedule-badge">予定</span>' : ''}`
      : "―";

    const inCell  = hasIn
      ? `<span class="${late ? 'time-in-late' : 'time-in-normal'}">${r.in}</span>`
      : `<span class="time-empty">―</span>`;
    const outCell = hasOut
      ? `<span class="time-out">${r.out}</span>`
      : `<span class="time-empty">―</span>`;
    const workCell = `<span class="time-work">${minToHHMM(workM)}</span>`;
    const correctBtn = isWE ? "" : `<button class="btn-correct" onclick="修正モーダル開く('${r.dateStr}')">修正</button>`;

    const tr = document.createElement("tr");
    if (isWE) tr.style.opacity = "0.4";
    tr.innerHTML = `
      <td class="td-date">${r.dateStr.slice(5)}<br><span class="td-day">（${days[r.dow]}）</span></td>
      <td class="time-scheduled">${scheduledCell}</td>
      <td>${inCell}</td>
      <td>${outCell}</td>
      <td style="color:#555">${r.breakMin ? r.breakMin + "分" : "―"}</td>
      <td>${workCell}</td>
      <td>${correctBtn}</td>
    `;
    tbody.appendChild(tr);
  });

  document.getElementById("logCard").className = "log-card show";
}

// 修正モーダル
function 修正モーダル開く(dateStr) {
  選択中の日付 = dateStr;
  document.getElementById("correctSub").textContent = `対象日：${dateStr}`;
  document.getElementById("correctTime").value    = "";
  document.getElementById("correctBreak").value   = "";
  document.getElementById("correctReason").value  = "";
  document.getElementById("correctType").value    = "出勤";
  種別切替();
  document.getElementById("correctOverlay").className = "modal-overlay show";
}

function 種別切替() {
  const type = document.getElementById("correctType").value;
  const isBreak = type === "休憩";
  document.getElementById("correctTime").style.display  = isBreak ? "none" : "block";
  document.getElementById("correctBreak").style.display = isBreak ? "block" : "none";
  if (isBreak) {
    document.getElementById("correctInputLabel").textContent = "正しい休憩時間（分）";
  } else if (type === "定時") {
    document.getElementById("correctInputLabel").textContent = "正しい定時（出勤時刻）";
  } else {
    document.getElementById("correctInputLabel").textContent = "正しい時刻";
  }
}

async function 修正申請送信() {
  const 名前    = document.getElementById("nameSelect").value;
  const 種別    = document.getElementById("correctType").value;
  const isBreak = 種別 === "休憩";
  const 値      = isBreak
    ? document.getElementById("correctBreak").value
    : document.getElementById("correctTime").value;
  const 理由 = document.getElementById("correctReason").value;

  if (!値)  { alert(isBreak ? "休憩時間を入力してください" : "正しい時刻を入力してください"); return; }
  if (!理由) { alert("修正理由を入力してください"); return; }

  const newTime = isBreak ? 値 : 値.slice(0,5);
  try {
    const url  = `${GAS_URL}?action=correct&name=${encodeURIComponent(名前)}&date=${encodeURIComponent(選択中の日付)}&type=${encodeURIComponent(種別)}&newTime=${encodeURIComponent(newTime)}&reason=${encodeURIComponent(理由)}`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) {
      モーダル閉じる('correctOverlay');
      トースト表示("✅ 修正申請を送信しました！承認後に反映されます");
    } else {
      alert("エラー：" + (data.error || "送信できませんでした"));
    }
  } catch(e) { alert("通信エラーが発生しました"); }
}

// 出勤予定モーダル
function 出勤予定モーダル開く() {
  const 名前 = document.getElementById("nameSelect").value;
  if (!名前) { alert("先に名前を選んでください！"); return; }

  const today = new Date();
  const pad = n => String(n).padStart(2,"0");

  // 明日の日付を最小値にする（当日は選択不可）
  const tomorrow = new Date(today);
  tomorrow.setDate(tomorrow.getDate() + 1);
  const minStr = `${tomorrow.getFullYear()}-${pad(tomorrow.getMonth()+1)}-${pad(tomorrow.getDate())}`;

  // 1ヶ月先の日付を最大値にする
  const maxDate = new Date(today);
  maxDate.setMonth(maxDate.getMonth() + 1);
  const maxStr = `${maxDate.getFullYear()}-${pad(maxDate.getMonth()+1)}-${pad(maxDate.getDate())}`;

  document.getElementById("scheduleDate").value = minStr;
  document.getElementById("scheduleDate").min   = minStr;
  document.getElementById("scheduleDate").max   = maxStr;
  document.getElementById("scheduleTime").value = "";
  document.getElementById("scheduleReasonGroup").style.display = "none";

  document.getElementById("scheduleOverlay").className = "modal-overlay show";
}



async function 出勤予定送信() {
  const 名前  = document.getElementById("nameSelect").value;
  const date  = document.getElementById("scheduleDate").value.replace(/-/g, "/");
  const time  = document.getElementById("scheduleTime").value;

  if (!date) { alert("日付を選んでください"); return; }
  if (!time) { alert("出勤予定時刻を入力してください"); return; }

  try {
    const url  = `${GAS_URL}?action=setSchedule&name=${encodeURIComponent(名前)}&date=${encodeURIComponent(date)}&time=${encodeURIComponent(time.slice(0,5))}&reason=`;
    const res  = await fetch(url);
    const data = await res.json();
    if (data.success) {
      モーダル閉じる('scheduleOverlay');
      トースト表示("✅ 出勤予定を登録しました！");
      ログ取得();
    } else {
      alert("エラー：" + (data.error || "送信できませんでした"));
    }
  } catch(e) { alert("通信エラーが発生しました"); }
}

function モーダル閉じる(id) {
  document.getElementById(id).className = "modal-overlay";
}

function トースト表示(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "toast show";
  setTimeout(() => { t.className = "toast"; }, 3500);
}

document.querySelectorAll(".modal-overlay").forEach(el => {
  el.addEventListener("click", function(e) {
    if (e.target === this) this.className = "modal-overlay";
  });
});
</script>
